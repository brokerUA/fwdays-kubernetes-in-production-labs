apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: security-policies
  namespace: flux-system
spec:
  interval: 5m
  chartRef:
    kind: OCIRepository
    name: security-policies
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    policies:
      readonlyRootfs:
        validationFailureAction: Audit
      personLabel:
        validationFailureAction: Enforce
