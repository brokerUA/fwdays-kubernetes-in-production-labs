name: Publish Platform GitLessOps OCI Artifact to GHCR

on:
  push:
    branches:
      - main
      - feature/module03
    paths:
      - 'gitlessops/**'
      - '.github/workflows/publish-platform-oci.yaml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for platform OCI artifact (e.g. latest, v1.0.0, rollback-1)'
        required: true
        default: 'latest'
        type: string
      tag_as_latest:
        description: 'Also tag and push as latest'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish-platform:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@main

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push platform manifests as OCI artifact
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${{ inputs.version || 'latest' }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          
          echo "==> Pushing GitLessOps platform manifests to oci://ghcr.io/${OWNER_LOWER}/platform-flux:${TAG}"
          flux push artifact "oci://ghcr.io/${OWNER_LOWER}/platform-flux:${TAG}" \
            --path="./gitlessops" \
            --source="${REPO_URL}" \
            --revision="${{ github.ref_name }}@sha1:${{ github.sha }}" \
            --annotations="org.opencontainers.image.source=${REPO_URL}" \
            --annotations="org.opencontainers.image.revision=${{ github.sha }}" \
            --annotations="org.opencontainers.image.version=${TAG}" \
            --annotations="org.opencontainers.image.created=$(date -u +%FT%TZ)" \
            --annotations="org.opencontainers.image.title=platform-gitlessops" \
            --annotations="org.opencontainers.image.description=Flux OCI artifact for GitLessOps platform manifests (CEL policies, multi-tenancy, tenant app releases)"

          if [ "${{ inputs.tag_as_latest }}" = "true" ] && [ "${TAG}" != "latest" ]; then
            echo "==> Also pushing as latest tag"
            flux push artifact "oci://ghcr.io/${OWNER_LOWER}/platform-flux:latest" \
              --path="./gitlessops" \
              --source="${REPO_URL}" \
              --revision="${{ github.ref_name }}@sha1:${{ github.sha }}" \
              --annotations="org.opencontainers.image.source=${REPO_URL}" \
              --annotations="org.opencontainers.image.revision=${{ github.sha }}" \
              --annotations="org.opencontainers.image.version=latest" \
              --annotations="org.opencontainers.image.created=$(date -u +%FT%TZ)" \
              --annotations="org.opencontainers.image.title=platform-gitlessops" \
              --annotations="org.opencontainers.image.description=Flux OCI artifact for GitLessOps platform manifests (CEL policies, multi-tenancy, tenant app releases)"
          fi
