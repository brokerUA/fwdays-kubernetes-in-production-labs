[tools]
flux2     = "2.9.6"
terraform = "1.16.5"
kubectl   = "1.37.1"
helm      = "4.3.1"
kind      = "0.33.0"
k9s       = "0.51.0"

[env]
TF_VAR_cluster_name   = "k8s-in-production"

[tasks."test:access"]
description = "Verify RBAC permissions and native admission policies against the running cluster"
run         = "bash tests/verify-access.sh"

[tasks."test:module03"]
description = "Verify Module 03 KinD, Flux Operator, RBAC, and native admission policies"
run         = "bash tests/verify-module03.sh"

[tasks."test:module04"]
description = "Verify Module 04 Istio Service Mesh, CEL Mutating Admission Policy, and sidecar injection"
run         = "bash tests/verify-module04.sh"

[tasks."test:module05"]
description = "Verify Module 05 VictoriaMetrics K8s Stack, Grafana dashboards, MetricsQL ingestion, and CEL admission audit alerts"
run         = "bash tests/verify-module05.sh"
