[tools]
flux2     = "2.9.6"
terraform = "1.16.5"
kubectl   = "1.37.1"
helm      = "4.3.1"
kind      = "0.33.0"
k9s       = "0.51.0"

[env]
TF_VAR_cluster_name   = "k8s-in-production"

[tasks."test:access"]
description = "Verify RBAC permissions and native admission policies against the running cluster"
run         = "bash tests/verify-access.sh"

[tasks."test:module03"]
description = "Verify Module 03 KinD, Flux Operator, RBAC, and native admission policies"
run         = "bash tests/verify-module03.sh"
