# Load image into kind cluster first:
# kind load docker-image go-service:latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-service
  namespace: student01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-service
  template:
    metadata:
      labels:
        app: go-service
    spec:
      containers:
      - name: go-service
        image: go-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: go-service
  namespace: student01
spec:
  type: ClusterIP
  selector:
    app: go-service
  ports:
  - port: 8080
    targetPort: 8080
