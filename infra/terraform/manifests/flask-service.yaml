# Load image into kind cluster first:
# kind load docker-image flask-service:latest
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-service
  namespace: student01
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-service
  template:
    metadata:
      labels:
        app: flask-service
    spec:
      containers:
      - name: flask-service
        image: flask-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
  namespace: student01
spec:
  type: ClusterIP
  selector:
    app: flask-service
  ports:
  - port: 5000
    targetPort: 5000
