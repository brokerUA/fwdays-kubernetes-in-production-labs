{{- range .Values.serviceAccounts.accounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
{{- if $.Values.serviceAccounts.createTokens }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}-token
  namespace: {{ .namespace }}
  annotations:
    kubernetes.io/service-account.name: {{ .name }}
  labels:
    app.kubernetes.io/managed-by: Helm
type: kubernetes.io/service-account-token
{{- end }}
{{- end }}
