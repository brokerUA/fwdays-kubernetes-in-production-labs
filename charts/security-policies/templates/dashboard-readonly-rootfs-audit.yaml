              "expr": "sum(increase(apiserver_validating_admission_policy_check_total{policy=\"require-readonly-rootfs\", enforcement_action=\"audit\"}[5m])) or sum(increase(apiserver_admission_policy_admission_evaluations_total{policy=\"require-readonly-rootfs\", action=\"Audit\"}[5m])) or vector(0)",
